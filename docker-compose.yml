services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: kernelme
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"

  app:
    build: .
    user: "1004:1004"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/var/www
    ports:
      - "8888:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db

volumes:
  dbdata: